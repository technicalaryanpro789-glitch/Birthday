        const decodedHTML = decodeURIComponent(utf8String);
        document.open(); document.write(decodedHTML); document.close();
    }catch(e){
        msg.innerText = "Access Denied: Invalid Key";
        msg.style.color = "#ef4444";
        if(document.getElementById('p')) document.getElementById('p').value = "";
    }
}
</script></body></html>
